services:
  - type: web
    name: cram-alexa-mcp
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run seed && npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: ./data/cram.db
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MCP_AUTH_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
